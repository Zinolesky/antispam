worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain application/json application/x-ndjson;
    gzip_min_length    1000;

    # ── Upstream: FastAPI (Python) ────────────────────────────────────────────────
    upstream fastapi_backend {
        least_conn;
        server fastapi:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ── Upstream: Go Sync Service ─────────────────────────────────────────────────
    upstream go_sync_backend {
        least_conn;
        server go-sync:8080 max_fails=3 fail_timeout=30s;
        keepalive 128;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # ── Health endpoint (served by nginx itself) ────────────────────────────
        location = /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # ── FastAPI routes ──────────────────────────────────────────────────────
        # Auth, reports, admin, single number check, user blocklists
        location ~ ^/api/v1/(auth|reports|admin|numbers|user) {
            proxy_pass         http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        # FastAPI OpenAPI docs (dev only)
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── Go Sync routes ──────────────────────────────────────────────────────
        # High-throughput delta sync and fast lookups
        location ~ ^/(sync|lookup) {
            proxy_pass         http://go_sync_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            # Support streaming NDJSON delta responses
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 120s;
        }

        # Go service health (proxied)
        location /go/health {
            proxy_pass http://go_sync_backend/health;
        }

        # ── Default 404 ────────────────────────────────────────────────────────
        location / {
            return 404 '{"error":"not_found"}';
            add_header Content-Type application/json;
        }
    }
}
