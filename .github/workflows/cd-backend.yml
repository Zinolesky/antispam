name: CD — Backend Services

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/cd-backend.yml"
  workflow_dispatch:

concurrency:
  group: cd-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # 1. Build & Push Docker Images to GitHub Container Registry (GHCR)
  # ──────────────────────────────────────────────────────────────────────────────
  publish-images:
    name: Build & Push (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: fastapi
            context: backend/fastapi
            image: antispam-fastapi
          - name: go-sync
            context: backend/go-sync
            image: antispam-go-sync

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract lowercase repository owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.service.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  # ──────────────────────────────────────────────────────────────────────────────
  # 2. Deploy to Production Server via SSH (when ENABLE_SSH_DEPLOY == 'true')
  # ──────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production Host
    needs: [publish-images]
    if: vars.ENABLE_SSH_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Docker Compose stack over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/antispam' }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          scp -r infra/* "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/infra/"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "
            set -e
            cd ${DEPLOY_PATH}/infra
            docker compose up -d --build --remove-orphans
            docker compose ps
          "
