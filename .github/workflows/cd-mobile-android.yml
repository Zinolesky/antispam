name: CD — Android Release & APK/AAB Build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "mobile/**"
      - ".github/workflows/cd-mobile-android.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build variant to produce"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

concurrency:
  group: cd-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Install NPM dependencies
        working-directory: mobile
        run: npm ci

      - name: Prepare Android environment & signing keystore
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Remove any host-specific local.properties so Gradle uses $ANDROID_HOME on the runner
          rm -f local.properties
          chmod +x gradlew

          # Ensure debug.keystore exists for fallback/debug signing
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Decode production upload keystore if configured in repository secrets
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/upload.keystore
            echo "Decoded production upload.keystore from secrets."
          fi

      - name: Build Android Release APK & App Bundle (AAB)
        if: github.event.inputs.build_type != 'debug'
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f app/upload.keystore ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            ./gradlew assembleRelease bundleRelease --no-daemon \
              -PMYAPP_UPLOAD_STORE_FILE=upload.keystore \
              -PMYAPP_UPLOAD_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
              -PMYAPP_UPLOAD_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
              -PMYAPP_UPLOAD_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          else
            ./gradlew assembleRelease bundleRelease --no-daemon
          fi

      - name: Build Android Debug APK
        if: github.event.inputs.build_type == 'debug'
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: antispam-android-apk-${{ github.sha }}
          path: |
            mobile/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Upload Android App Bundle (AAB) artifact
        if: github.event.inputs.build_type != 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: antispam-android-aab-${{ github.sha }}
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
