version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/backend/fastapi"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/backend/go-sync"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/mobile/android"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/backend/fastapi"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/backend/go-sync"
    schedule:
      interval: "weekly"
