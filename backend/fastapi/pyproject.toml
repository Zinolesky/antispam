[project]
name = "antispam-fastapi"
version = "1.0.0"
description = "AntiSpamApp — Auth, Reports, Admin backend"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # Redis
    "redis[hiredis]>=5.2.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.0",      # OAuth2 HTTP client
    "authlib>=1.3.2",     # OAuth2 library

    # Validation & config
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # Background tasks
    "apscheduler>=3.10.4",

    # Utils
    "python-multipart>=0.0.18",
    "slowapi>=0.1.9",       # Rate limiting
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
